<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cambiar tu contraseña · Rityvo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e0e10; color: #f2f2f3; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .caja { width: 100%; max-width: 380px; }
  h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: .3px; }
  p.sub { color: #a1a1a6; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: #8a8a90; margin: 16px 0 8px; }
  input {
    width: 100%; padding: 14px; font-size: 16px; border-radius: 12px;
    border: 1px solid #2a2a2e; background: #18181b; color: #f2f2f3;
  }
  input:focus { outline: none; border-color: #c8ff3e; }
  button {
    width: 100%; margin-top: 24px; padding: 16px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 14px; background: #c8ff3e; color: #0a0a0b; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .aviso { border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.5; margin-top: 20px; }
  .error { background: rgba(255,68,68,.10); color: #ff6262; }
  .ok    { background: rgba(200,255,62,.10); color: #c8ff3e; }
  .pie { color: #6c6c72; font-size: 12px; line-height: 1.5; margin-top: 28px; text-align: center; }
  .pie a { color: #8a8a90; }
</style>
</head>
<body>
<div class="caja">
  <h1>Cambiar tu contraseña</h1>
  <p class="sub" id="sub">Escribe tu contraseña nueva. Después vuelve a la app y entra con ella.</p>

  <form id="form" hidden>
    <label for="p1">Contraseña nueva</label>
    <input id="p1" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
    <label for="p2">Repítela</label>
    <input id="p2" type="password" autocomplete="new-password" placeholder="La misma de arriba">
    <button id="btn" type="submit">GUARDAR CONTRASEÑA</button>
  </form>

  <div id="msg"></div>

  <p class="pie">
    Rityvo · <a href="/privacy-policy.html">Privacidad</a> ·
    <a href="/terms-of-service.html">Términos</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var URL_SB = "https://rpoqsanpyciecybpaget.supabase.co";
  var ANON   = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwb3FzYW5weWNpZWN5YnBhZ2V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MDc1MzksImV4cCI6MjA5MzA4MzUzOX0.a1tsrOwAAaRQ30T6Yg9KY936fsLNUReFQVL9whNwRJw";

  var form = document.getElementById('form');
  var msg  = document.getElementById('msg');
  var sub  = document.getElementById('sub');
  var btn  = document.getElementById('btn');

  function aviso(texto, clase) {
    msg.innerHTML = '<div class="aviso ' + clase + '">' + texto + '</div>';
  }

  if (!window.supabase) {
    aviso('No pudimos cargar la página. Revisa tu conexión y vuelve a abrir el enlace.', 'error');
    return;
  }

  var cliente = window.supabase.createClient(URL_SB, ANON, {
    auth: { detectSessionInUrl: true, flowType: 'implicit', persistSession: false }
  });

  // Supabase devuelve el token en el fragmento (#access_token=...) o, en el
  // flujo nuevo, como ?code=. El SDK lo recoge solo con detectSessionInUrl.
  // Aquí solo hay que esperar a que exista sesión antes de dejar escribir.
  cliente.auth.getSession().then(function (r) {
    var haySesion = r && r.data && r.data.session;
    var hash = window.location.hash || '';
    var errorEnUrl = /error=/.test(hash) || /error=/.test(window.location.search);

    if (errorEnUrl) {
      // Caso real y frecuente: el enlace ya se usó, o caducó.
      sub.textContent = '';
      aviso('Este enlace ya no sirve: o se usó antes, o caducó. Pide uno nuevo desde la app, en «¿Olvidaste tu contraseña?».', 'error');
      return;
    }
    if (!haySesion) {
      sub.textContent = '';
      aviso('Abre esta página desde el enlace del correo. Si llegaste aquí de otra forma, pide un enlace nuevo desde la app.', 'error');
      return;
    }
    form.hidden = false;
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var p1 = document.getElementById('p1').value;
    var p2 = document.getElementById('p2').value;

    if (p1.length < 8) { aviso('La contraseña necesita al menos 8 caracteres.', 'error'); return; }
    if (p1 !== p2)     { aviso('Las dos contraseñas no coinciden.', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'GUARDANDO…';
    msg.innerHTML = '';

    cliente.auth.updateUser({ password: p1 }).then(function (r) {
      if (r.error) {
        btn.disabled = false;
        btn.textContent = 'GUARDAR CONTRASEÑA';
        aviso(r.error.message || 'No pudimos guardarla. Intenta de nuevo.', 'error');
        return;
      }
      form.hidden = true;
      sub.textContent = '';
      aviso('Listo. Tu contraseña quedó cambiada.<br><br>Abre Rityvo y entra con ella desde «¿Ya tienes cuenta? Inicia sesión».', 'ok');
      // La sesión de esta página no se conserva (persistSession:false), así que
      // el enlace no queda utilizable en el navegador de nadie más.
      cliente.auth.signOut().catch(function () {});
    });
  });
})();
</script>
</body>
</html>
